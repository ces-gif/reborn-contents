name: 매일 카드뉴스 + BEST5 블로그 + 인스타 스토리

# 매일 한국시간 낮 12시(12:00 KST = 03:00 UTC)에 자동 실행된다.
# 오전 11:30까지 드라이브에 올린 사진이 대상이다.
# 깃허브 서버에서 도는 작업이라 은성님 컴퓨터가 꺼져 있어도 그대로 실행된다.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "처리할 날짜 (YYYY-MM-DD, 비우면 오늘)"
        required: false
        type: string
      dry_run:
        description: "드라이브 업로드/알림 없이 만들어만 보기"
        required: false
        type: boolean
        default: false
      reprocess:
        description: "이미 처리한 사진도 다시 처리"
        required: false
        type: boolean
        default: false

concurrency:
  group: reborn-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 콘텐츠 생성 및 발행
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          # 모델 공급자 — 둘 중 하나만 있어도 된다 (제미나이가 무료)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          # 인스타그램 스토리 자동 게시
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # 카드뉴스를 공개 URL 로 올릴 곳 (인스타는 공개 URL 만 받는다)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          # 설정값을 저장소 수정 없이 바꾸고 싶을 때만 리포지토리 Variables 로 지정한다.
          PUBLISH_FOLDER_NAME: ${{ vars.PUBLISH_FOLDER_NAME }}
          PUBLISH_PARENT_ID: ${{ vars.PUBLISH_PARENT_ID }}
          LOGO_FILE_ID: ${{ vars.LOGO_FILE_ID }}
          STORE_NAME: ${{ vars.STORE_NAME }}
          MAX_CARDS_PER_DAY: ${{ vars.MAX_CARDS_PER_DAY }}
          INSTAGRAM_ENABLED: ${{ vars.INSTAGRAM_ENABLED }}
          MAX_STORIES_PER_DAY: ${{ vars.MAX_STORIES_PER_DAY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          VISION_MODEL: ${{ vars.VISION_MODEL }}
          WRITING_MODEL: ${{ vars.WRITING_MODEL }}
        run: |
          python scripts/run_daily.py \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.reprocess && '--reprocess' || '' }}

      - name: 생성물 아티팩트로 보관 (2주)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reborn-contents-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore
