name: 매일 카드뉴스 + BEST5 블로그 + 인스타 스토리

# 오전 11:32 에 그날 분을 발행하고, 그 뒤로는 2시간마다 새 사진을 집어간다.
# 오전 11:30까지 올린 사진이 12시 발행 대상이고, 그 뒤에 올린 사진도
# 최대 2시간 안에 카드뉴스가 된다 (다음 날까지 기다리지 않는다).
# 깃허브 서버에서 도는 작업이라 은성님 컴퓨터가 꺼져 있어도 그대로 실행된다.
#
# 시각을 이렇게 잡은 이유:
#   · 깃허브 무료 러너의 예약 실행은 대기열에 밀린다. 정각(:00)이 가장 붐빈다.
#     실제로 12:00 예정이 12:55 에 돈 날이 있었다. 그래서 정각을 피해 :32 로 잡고,
#     업로드 마감(11:30) 직후에 시작하게 했다.
#   · 두 번째 줄은 안전망이다. 첫 실행이 밀리거나 실패해도 13:10 에 다시 집어간다.
#     이미 처리한 사진은 원장에 남아 있어 건너뛰므로, 할 일이 없으면 1분 안에 끝난다.
on:
  schedule:
    # 08-26 에 11:32 예약이 **아예 안 돌았다**. 깃허브 예약 실행은 밀리는 정도가
    # 아니라 통째로 누락되기도 한다. 그래서 오전에 세 번 건다 — 앞 실행이 성공했으면
    # 원장을 보고 1분 안에 끝나므로 부담이 없고, 하나만 살아나도 카드는 나온다.
    - cron: "32 2 * * *"   # 11:32 KST — 본 실행 (오전 업로드분)
    - cron: "47 2 * * *"   # 11:47 KST — 15분 뒤 재시도
    - cron: "5 3 * * *"    # 12:05 KST — 한 번 더
    # 영업시간 중 2시간마다 한 번씩 새 사진을 집어간다.
    # 오후에 올린 사진이 다음 날까지 묵지 않게 하려는 것이다.
    # 새 사진이 없으면 원장을 보고 1분 안에 끝나므로 부담이 거의 없다.
    - cron: "10 4 * * *"   # 13:10 KST
    - cron: "10 6 * * *"   # 15:10 KST
    - cron: "10 8 * * *"   # 17:10 KST
    - cron: "10 10 * * *"  # 19:10 KST
    - cron: "10 12 * * *"  # 21:10 KST — 마감 후 마지막 한 번
  workflow_dispatch:
    inputs:
      date:
        description: "처리할 날짜 (YYYY-MM-DD, 비우면 오늘)"
        required: false
        type: string
      dry_run:
        description: "드라이브 업로드/알림 없이 만들어만 보기"
        required: false
        type: boolean
        default: false
      reprocess:
        description: "이미 처리한 사진도 다시 처리"
        required: false
        type: boolean
        default: false
      store:
        description: "이 매장만 실행 (비우면 전체). 예: reborn-pt, fox-ils"
        required: false
        type: string

concurrency:
  group: reborn-daily
  cancel-in-progress: false

permissions:
  contents: read
  issues: write        # 실패하면 이슈를 열어 알린다

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 스텝의 if 에서는 secrets 를 직접 못 읽는다. 여기서 한 번 걸러 둔다.
    env:
      USE_CLAUDE_SUBSCRIPTION: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 클로드 구독으로 돌리는 길. CLAUDE_CODE_OAUTH_TOKEN 시크릿이 있을 때만 설치한다.
      # 이게 있으면 API 키도 종량 결제도 필요 없다 (은성님이 코워크에서 쓰시던 것과 같은 구독).
      - name: 클로드 코드 설치 (구독으로 돌릴 때만)
        if: env.USE_CLAUDE_SUBSCRIPTION == 'true'
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: 콘텐츠 생성 및 발행
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          # 모델을 부르는 방법 — 셋 중 하나만 있으면 된다. 위에서부터 우선한다.
          #   1. CLAUDE_CODE_OAUTH_TOKEN : 클로드 구독으로 돈다. 추가 비용 없음. (권장)
          #      내 컴퓨터에서 `claude setup-token` 으로 발급
          #   2. GEMINI_API_KEY          : 무료 등급은 하루 20회라 상품 10개쯤에서 막힌다
          #   3. ANTHROPIC_API_KEY       : Claude API 선불 크레딧 (구독과 별개)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          # 인스타그램 스토리 자동 게시
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # 카드뉴스를 공개 URL 로 올릴 곳 (인스타는 공개 URL 만 받는다)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          # 설정값을 저장소 수정 없이 바꾸고 싶을 때만 리포지토리 Variables 로 지정한다.
          PUBLISH_FOLDER_NAME: ${{ vars.PUBLISH_FOLDER_NAME }}
          PUBLISH_PARENT_ID: ${{ vars.PUBLISH_PARENT_ID }}
          LOGO_FILE_ID: ${{ vars.LOGO_FILE_ID }}
          STORE_NAME: ${{ vars.STORE_NAME }}
          MAX_CARDS_PER_DAY: ${{ vars.MAX_CARDS_PER_DAY }}
          INSTAGRAM_ENABLED: ${{ vars.INSTAGRAM_ENABLED }}
          MAX_STORIES_PER_DAY: ${{ vars.MAX_STORIES_PER_DAY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          VISION_MODEL: ${{ vars.VISION_MODEL }}
          WRITING_MODEL: ${{ vars.WRITING_MODEL }}
        run: |
          python scripts/run_daily.py \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.reprocess && '--reprocess' || '' }} \
            ${{ inputs.store && format('--store {0}', inputs.store) || '' }}

      # 조용히 실패하는 것이 제일 위험하다. 잘못되면 이슈를 열어 메일이 가게 한다.
      # (실행 자체가 죽은 경우 + 돌긴 돌았는데 사진이 있는데 카드가 0장인 경우)
      - name: 문제가 있으면 이슈로 알리기
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const jobFailed = '${{ job.status }}' !== 'success';
            let status = null;
            try { status = JSON.parse(fs.readFileSync('out/_status.json', 'utf8')); } catch (e) {}

            const problems = [];
            if (jobFailed) problems.push('실행이 도중에 멈췄습니다.');
            for (const s of (status?.stores ?? [])) {
              if (!s.ok) problems.push(`${s.name}: 실행 실패`);
              else if (s.photos > 0 && s.cards === 0)
                problems.push(`${s.name}: 사진 ${s.photos}장이 올라왔는데 카드뉴스가 0장입니다.`);
              for (const p of (s.problems ?? [])) problems.push(`${s.name}: ${p}`);
            }
            if (!status && !jobFailed) problems.push('실행 결과 파일이 없습니다.');
            if (problems.length === 0) return;

            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const lines = [
              '자동 발행에 문제가 있었습니다.',
              '',
              ...problems.map((p) => `- ${p}`),
              '',
              `실행 기록: ${runUrl}`,
              '',
              '13:10 안전망 실행이 한 번 더 시도합니다. 그때도 안 되면 사람이 봐야 합니다.',
            ];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ 콘텐츠 자동 발행 확인 필요 (${today})`,
              body: lines.join('\n'),
            });

      - name: 생성물 아티팩트로 보관 (2주)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reborn-contents-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore
