        모바일 검수도 SSCM 사이트에서 함께 진행해야 한다.
      cadence: 주 1회 방문
      avoid: 목요일 방문 자제 요청
    watch:
      - "시스템 7 수리 건 계산서 발행 여부 확인"
      - "암병원 플라이트 헬멧 배터리·코드 구매 건, sevit 사이트에서 발주 여부 확인"
