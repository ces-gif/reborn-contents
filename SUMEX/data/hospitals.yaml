# SUMEX 거래처 · 납품서류 규칙 마스터
#
# 출처
#   A = 전임자 인수인계서.xlsx        (2026-08-19)
#   B = SUMEX 거래처관리표 인수인계 (2026-08-14, 담당자 현장 확인)
#
# ※ 개인정보(교수·간호사·담당자 실명, 휴대폰, 이메일)는 이 파일에 넣지 않는다.
#    → data/private/contacts.yaml (git 제외) 에서 관리한다.
#
# copies      : 준비해야 할 서류 총 매수
# stamp       : 병원 도장(날인)이 필요한가
# distribution: 각 부를 어디에 두고 오는가 (합계 = copies)
# conflicts   : 두 출처가 다르게 말하는 항목. 현장에서 확인해 확정할 것.

meta:
  owner: SUMEX 영업 담당
  predecessor: 전임 담당자 (퇴사 예정, 법인폰 번호 승계)
  updated: 2026-08-23
  doc_default_copies: 4   # 특별한 규칙이 없으면 4장이 기본

hospitals:

  - id: snuh
    name: 서울대학교병원
    short: 서울대
    tier: 상급종합
    region: 서울 종로
    priority: 상
    consignment: 이지메디컴
    doc_type: 거래명세서
    delivery:
      mode: 택배
      process: |
        간납사(이지메디컴) 시스템에서 재고조회 → 납품생성 → 수량 및 LOT No. 기입.
        납품명세서를 동봉해 서울대학교병원 오산창고로 택배 발송.
      recurring:
        - 플라이트 후드 2주 간격 발송
        - Shaver / RF Tip 발주 여부 주기적 확인
    watch:
      - "이지메디컴 7월 계산서 미발행 건 있음"
      - "6·7월 shaver 류가 계산서에 반영 안 된 이유 파악 필요"
    source: [A, B]

  - id: snubh
    name: 분당서울대학교병원
    short: 분당서울대
    tier: 상급종합
    region: 경기 성남 분당
    priority: 최상
    consignment: null
    doc_type: 거래명세서
    doc:
