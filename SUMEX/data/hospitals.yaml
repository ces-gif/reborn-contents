      windows: ["09:00-11:00", "13:00-16:00"]
      cold_chain_cutoff: "14:00"   # 냉장·냉동 품목은 이 시각 이전만 가능
      packaging: 쇼핑백 말고 흰색 봉투에 넣어 방문
      hard_rule: 시간대를 놓치면 그날 납품 불가 → 재방문
    conflicts:
      - field: delivery.site
        A: "분당서울대병원에서 서류 4장 출력 후 헬스케어혁신파크 지하 1층 관리팀"
        B: "납품처 헬스케어혁신파크 지하 주차장"
        action: 첫 방문 시 실제 하차·제출 지점 확정
    open:
