  - id: skin_closure
    name: 피부봉합
    depts: [OS, NS, GS 전 과]
    items:
      - id: zip
        name: Zip Surgical / ZipSeal / PreLoc
        aka: [집라인, Zip Line]
        what: 봉합사·스테이플러를 대체하는 비침습 표피 봉합 장치
        must_say: "Zip은 표피 봉합만 대체합니다. 진피와 피하조직은 선생님이 그대로 봉합하셔야 합니다."
        tech: { 동적압박: 교차 천공으로 길이 방향 유연성, 격리구역: 스캐폴드가 창상을 견인력에서 차단 }
        material: { 접착층: 하이드로콜로이드(장루 주머니 계열), 외곽: 탄성 폴리우레탄, 잠금: 나일론 락 1mm 조절 }
        lines:
          - { name: Zip Surgical, gap: "2~3mm 권장 / 최대 5mm" }
          - { name: ZipSeal, note: "Zip Surgical + LiquiBand OCTYL" }
          - { name: PreLoc, gap: 최대 2cm, use: 궤양·고장력 창상 }
          - { name: Zip DS Dressing Shield, use: 드레싱 접착제로부터 Zip 보호 }
        evidence:
          적용속도: 봉합사 대비 3배 빠름
          견인력저항: 봉합사 대비 8배
          드레싱교체통증: 스테이플 대비 1/4
          굴곡각도: 스테이플 대비 최대 10도 추가
          임상: 동료심사 논문 21편, 30개국 60만 건 이상
        apply_steps:
          - 라이너 #1 제거 (장갑이 접착면에 닿지 않게)
          - 절개선 길이·폭 중앙 정렬 — 한 번 피부에 닿으면 들어 올리지 않는다
          - 라이너 #2를 몇 cm씩 벗기며 "걸어가듯" 눕힌다 (늘이지 말 것)
          - 락 박스를 잡고 스트랩 하나씩 2~3클릭으로 창연을 맞춘다 (과도하게 조이지 않음)
          - (선택) 접착제 병용 — 도포 후 60초 경화 대기
          - 스트랩을 짧게 다듬는다. 드레싱 테이프가 Zip 본체에 직접 닿지 않게
          - 착용 표준 14일, 최대 30일
        knee_tip: 무릎 정중 절개는 적용 전 45~60도 굴곡
        competitors:
          Prineo: { by: Ethicon, weak: [아크릴레이트 알레르기, OR 내 건조시간 7분 이상, 러닝스티치 비용 별도] }
          Exofin Fusion: { by: Chemence, weak: [창상 폐색, 아크릴레이트 반응, 고가, 사이즈 2종뿐] }
          Insorb: { by: Incisive, weak: [임상 근거 제한적] }
          Steri-Strip: { by: 3M, weak: [보강용이지 폐쇄용 아님, 힘 분산 안 됨] }
        frame: "'Prineo 대신 Zip'이 아니라 '스테이플·봉합사 대신 Zip'이 대화 프레임이어야 한다"
        accounts: [seoul-spine, nowon-eulji]

  - id: sports_medicine
    name: 스포츠메디슨
    depts: [OS 어깨, OS 무릎, OS 고관절, 족부]
    items:
      - id: iconix
        name: ICONIX All-Suture Anchor
        aka: [아이코닉스, ICONIX 1, ICONIX TT, ICONIX Speed, InteliBraid]
        what: 봉합사 자체가 뼈 구멍 안에서 부풀어 고정되는 all-suture 앵커
        diameters: [1.4mm, 2.3mm]
        options: 총 14가지 봉합사·앵커 테이프 조합 (더블/트리플 로디드, 니들 유무, 셀프펀칭 유무)
        materials: ["#5 봉합사", "#2 봉합사", 1.2mm 앵커 테이프, 2.0mm 앵커 테이프]
        speed: 셀프펀칭 — 별도 드릴링 없이 앵커 배치
        guides: [스트레이트 숏, 스트레이트, 12도, 12도 슬랜트, 25도, 25도 슬랜트, 일회용 키트]
        indications:
          어깨: [회전근개 봉합, 관절와순 봉합(Bankart/SLAP), 이두건 고정]
          무릎: [반월상연골판 뿌리 봉합, 내측측부인대 보강]
          족부: [아킬레스건 부착부, 인대 재건]
          고관절: [관절와순 봉합]
        three_logics:
          - "골 보존 — 1.4mm면 재수술 여지를 남깁니다"
          - "골질 대응 — 골다공증 상완골두에서 나사식보다 안정적입니다"
          - "시간 — Speed는 펀칭 단계가 빠집니다"
        competitors: [Arthrex Knotless FiberTak, CONMED Y-Knot, Smith+Nephew Q-FIX]
        reality: |
          Arthrex와 앵커 대 앵커 정면 승부는 하지 않는다. 국내 어깨 관절경에서 Arthrex는 사실상 표준이고
          레지던트·펠로우 교육 단계부터 손에 익어 있다.
          진입 경로 ①영상 타워와 묶기 ②재수술·골다공증 케이스 ③Young Surgeon
        accounts: [sejong-sports, seoul-spine, cheongdam-lion, seoul-medical-center, guri-central, nowon-eulji]

      - id: alphavent
        name: AlphaVent
        what: 바이오컴포지트 스크류인(나사형) 하드바디 앵커
        pair_with: ICONIX
        why: 골질·술자 선호에 따라 all-suture와 나뉨. 두 타입을 함께 제안하면 '손맛' 이탈 위험이 낮아짐
        accounts: [korea-univ, seoul-medical-center, guri-central, amc]

      - id: inspace
        name: InSpace
        what: 생분해성 견봉하 풍선 스페이서
        indication: MIRCT — 광범위 비봉합성 회전근개 파열
        strategic: 동등 승인 제품이 사실상 없다. 독점 카테고리는 임상적 필요성으로 판다
        script: "봉합 가능한 파열은 보강 개념, 봉합 불가능한 파열은 공간 확보 개념"

      - id: crossfire
        name: Crossfire
        what: 관절경 Resection 플랫폼 (셰이버·RF 통합)
        accounts: [cheongdam-harrison, haneul, snubh]

      - id: rf_probe
