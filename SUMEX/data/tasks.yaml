recurring:

  - id: R-month-close
    title: 월 마감
    when: 매월 1~3일
    pri: 최상
    steps:
      - "청담리온 — 월 마감을 1~3일 사이에 반드시 처리 (지연 시 간납사 독촉)"
      - "노원을지 — 매월 1일 토탈메디칼 사이트 접속해 이달 마감 기간 확인"
      - "고대병원 — 간납사 사이트 마감 일정 공지 확인. 계산서 1부 + 거래명세서 3부 + 한 달치 선납서 전체 지참"
      - "세종스포츠 — 도장 받은 거래명세서 스캔본 + 간납금액 거래명세서 메일 발송"
      - "하늘병원 — 구매과에 매출원장 전달"
      - "성남시의료원 — 파마블루 발송 거래명세서 수령 확인"
    hard_rule: "고대병원은 거래명세서 수량 총합 == 선납서 수량 총합 이어야 마감이 통과된다"

