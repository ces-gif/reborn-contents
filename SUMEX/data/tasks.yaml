    title: 월말 수금
    when: 매월 말
    pri: 상
    steps:
      - "하늘병원 — 구매과와 일정 논의 후 직접 방문하여 카드 수금"

  - id: R-week-schedule
    title: 주간 수술 스케줄 확보 → 재고 역산
    when: 매주 월요일
    pri: 최상
    steps:
