      - "케이스별 필요 품목 역산 (케이스 커버 7축: 카메라·빛·물·칼·에너지·고정·봉합)"
      - "부족분 발주. 앵커·스크류는 사이즈 상하 한 단계씩 여유"

  - id: R-week-close
    title: 주간 마무리
    when: 매주 금요일
    pri: 상
    steps:
      - "클레임·미결 건 마감"
      - "견적·서류 처리"
      - "다음 주 방문 계획 수립"
      - "치료재료 상한금액 신규 고시 모니터링"

