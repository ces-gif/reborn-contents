# SUMEX 서류 종류 정의 — 무엇을, 언제, 어떤 양식으로 쓰는가
#
# 파일명 규칙(실제 사용 중):
#   SUMEX {서류종류}({품목 또는 병원})_{YYMMDD}[_{간납사 또는 부서}].xlsx
#   예) SUMEX 거래명세서(엑소핀)_260810_수술방.xlsx
#       SUMEX 가납서(신촌세브란스병원)_260813.xlsx
#       SUMEX Flyte Helmet 견적서 (신촌세브란스)_260806.xlsx
#
# layout: 자사 xlsx 양식에서 어떤 셀에 무엇이 들어가는지.
#         src/sumex/docs.py 가 이 좌표를 그대로 사용한다.

filename_pattern: "SUMEX {doc_type}({subject})_{yymmdd}{suffix}.xlsx"

types:

  - id: transaction_statement
    name: 거래명세서
    en: Transaction Statement
    when: 실제 납품(사용분 발생)이 확정되었을 때. 가장 많이 쓰는 서류
    who_signs: 병원 각 부서 (병원에 따라 도장 유무가 다름 → hospitals.yaml)
    copies_default: 4
    template: templates/거래명세서.xlsx      # 자사 실양식(비공개). 없으면 코드가 생성
    sheet: "견적서 (2)"
    layout:
      title:        { cell: A2,  value: "거 래 명 세 서" }
      date:         { cell: A7,  type: date,  merged: A7:C7 }
      hospital:     { cell: A9,  format: "병원명 : {hospital}", merged: A9:C9 }
      biz_no:       { cell: D6,  format: "사업자등록번호 : {biz_no}" }
      company:      { cell: D7,  format: "상호명  : {company}" }
      address:      { cell: D8,  format: "주 소 : {address}" }
      ceo:          { cell: D9,  format: "대표자 : {ceo}" }
      header_row:   { row: 11, columns: [NO, 코드, 상품명, 포장단위, 수량, 단가, 금액] }
      items:        { first_row: 12, last_row: 37, cols: { no: A, code: B, name: C, unit: D, qty: E, price: F, amount: G } }
      amount_formula: "=E{row}*F{row}"
      total:        { cell: F38, formula: "=SUM(G12:G37)" }
      total_label:  { cell: G38, value: "(VAT 포함)" }
      supply:       { label: F39, cell: G39, formula: "=F38/1.1" }   # 공급가액
      vat:          { label: F40, cell: G40, formula: "=G41-G39" }   # 부가세
      grand:        { label: F41, cell: G41, formula: "=F38" }       # 합계
      account:      { cell: C42, format: "결제계좌 : {bank_account}" }
    notes:
      - 금액은 VAT 포함가로 입력하고, 공급가액은 /1.1 로 역산하는 구조다.
      - 병원에 따라 '환자 1명당 1건'으로 쪼개야 한다 (청담리온).
      - 간납사가 거래명세서를 대신 만들어 주는 계정도 있다 (성남시의료원-파마블루, 노원을지-토탈메디칼, 구리센트럴-아네스).

  - id: provisional_delivery
    name: 가납서
    en: Provisional Delivery Note
    when: |
      정식 구매 절차(코드 등재·발주) 전에 물건을 먼저 병원에 들여놓을 때.
      나중에 사용분이 확정되면 거래명세서로 정산한다.
    layout_ref: transaction_statement   # 양식 구조는 거래명세서와 동일
    seen_at: [severance-sinchon, seoul-medical-center, sanggye-paik, guri-central]

  - id: advance_delivery
    name: 선납서
    en: Advance Delivery Note
    when: 사용분이 발생할 때마다 환자 단위로 먼저 제출하는 서류
    fields_required: [환자명, 코드, 수량]
    copies_default: 2
    critical: |
      고대병원은 한 달간 납품한 선납서 '전체'를 월 마감 때 묶어서 제출해야 하고,
      거래명세서상 수량 총합과 선납서 수량 총합이 정확히 일치해야 마감이 통과된다.
      선납서를 한 장이라도 분실하면 마감을 도와주지 않는다. → 발행 즉시 스캔 보관.
    seen_at: [seoul-medical-center, korea-univ, severance-sinchon]

  - id: quotation
    name: 견적서
    en: Quotation
    when: 장비(캐피털) 제안, 수리비 청구, 신규 품목 도입 검토
    sheet: 견적서
    layout:
      title:     { cell: A2, value: "Q U O T A T I O N" }
      date:      { cell: A5, type: date, merged: A5:C5 }
      to:        { cell: A7, format: "{hospital} 귀하", merged: A7:C7 }
      total_top: { cell: C9, formula: "=F9" }
      header_row: { row: 10, columns: ["CAT. NO.", DESCRIPTION, QTY, "UNIT.PRICE(+VAT)", AMOUNT, Group] }
      items:     { first_row: 11, last_row: 42, cols: { no: A, code: B, name: C, qty: D, price: E, amount: F } }
      group_row: { pattern: "<{GROUP NAME}>", col: C }   # 예: <1788 VIDEO CAMERA SYSTEM>
      total:     { row: 43, qty: D43, amount: F43 }
      validity:  { cell: B44, value: "상기 견적가는 제출일로 부터 1개월간 유효합니다." }
      rep:       { cell: E45, format: "영업담당자 : {rep_name} {rep_title} {rep_phone}" }
    notes:
      - 품목을 <카메라 시스템> <광원> <인슈플레이터> 처럼 그룹 헤더로 묶는다.
      - 장비 제안은 낱개가 아니라 패키지로. 카메라+펌프+셰이버·RF+임플란트를 묶어야 경쟁사가 못 낀다.

  - id: demo_receipt
    name: 데모인수증
    en: Demo Receipt (Demo Release Request)
    form_no: KQF-OPC-009-F
    issuer: 한국스트라이커㈜ (수입자)
    request_to: Commercial Reporting Team (송파 서울복합물류단지 A동 603-2호)
    when: 병원에 데모 장비를 반출할 때. 스트라이커 양식을 그대로 사용
    fields:
      header:
        - { key: 부서 및 대리점, value: SUMEX }
        - { key: 담당자, value: "{rep_name} {rep_phone}" }
      receiver:
        - 병원명
        - 요양기관번호
        - 주소
        - 병원과
        - 의사명
        - 출고일
        - 회수일          # 통상 출고일 + 30일
      product_row: [No., 모델명, 제품명, "Q'ty", "제조번호(Serial/Lot)", 허가번호, 품목명, 제조원상호, 의료기기여부]
      signature:
        - { key: "Date of Receive (의료기관 제공일자/설치완료일자)", by: [의료기관, "직판/대리점(SUMEX)"] }
        - { key: "Date of Return (의료기관 회수일자)",              by: [의료기관, "직판/대리점(SUMEX)"] }
      shipping: [배송 접수 담당자, 전화번호, 출고 요청일, 출고방법, 도착지 상세 주소, 받는이, 용달 배차 시간]
    terms:
      - 출고일 포함 3일 안에 제품·수량을 확인해야 한다. 3일 이후 인수 완료로 처리된다.
      - 대여 물품은 평가용으로만, 요청 병원 외에는 사용할 수 없다.
      - 대여 물품은 한국스트라이커㈜ 자산이며 오손·파손·분실 시 해당 업체가 배상 책임을 진다.
      - 대여 물품의 표시·기재사항을 제거하지 말 것.
      - 환자에게 사용할 경우 그 비용을 별도로 청구할 수 없다.
      - 기재 사항은 의료기기법에 따라 지출보고서에 포함되어 공개되거나 심평원 등에 제출될 수 있다.
    return_address: 서울 송파구 송파대로 55 A동 603-2호 스트라이커 CR팀
    checklist_before_demo:
      - 데모 전날 장비 전원·소프트웨어 버전·프리셋 확인
      - 백업 카메라 헤드와 광케이블 반드시 동행
      - 스코프 상태(렌즈 흠집·광섬유 손실) 사전 점검
      - 모니터 위치와 케이블 길이 사전 확인
      - 데모 종료 후 24시간 내 피드백 정리하여 서면 회신

  - id: tax_invoice
    name: 세금계산서
    when: 월 마감 시. 병원·간납사별 마감일에 맞춰 발행
    caution: 을지병원은 세금계산서와 심사마감 서류의 제출처가 서로 다르다 (지하 관리팀 vs 별관)

  - id: sales_ledger
    name: 매출원장
    when: 하늘병원 — 매월 초 구매과에 전달
