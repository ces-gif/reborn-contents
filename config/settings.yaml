# 리본마켓 자동 콘텐츠 발행 설정
# 대부분의 값은 같은 이름의 대문자 환경변수로 덮어쓸 수 있습니다. (예: PUBLISH_FOLDER_NAME)

drive:
  # 상품 사진이 올라오는 폴더들. 폴더마다 성격이 달라서 문구가 달라진다.
  sources:
    - name: "리퍼"
      folder_id: "1oAEi2LrzoOSlDO1TwVDpVWdb771wHdqz"
      kind: "refurb"          # 검수를 마친 리퍼브 상품
      eyebrow: "오늘의 리본 특가"
    - name: "새상품"
      folder_id: "17EZH2F7VgEHbc4mHfNmS2nI9RBI-sCmR"
      kind: "new"             # 제조사와 직거래한 미개봉 새상품
      eyebrow: "제조사 직거래 새상품"

  # 생성된 콘텐츠를 업로드할 폴더 이름. 없으면 자동 생성한다.
  publish_folder_name: "콘텐츠 발행"
  # 콘텐츠 발행 폴더를 만들 상위 폴더. 비우면 소스 폴더의 상위 폴더(입고상품)에 만든다.
  publish_parent_id: ""
  # 리본마켓 로고 PNG 파일 ID (드라이브: 입고상품/리본마켓로고).
  # 카드뉴스마다 이 로고를 넣는다. 저장소에 assets/reborn_logo.png 를 두면 그쪽이 우선한다.
  logo_file_id: "1WWB5_20er3Sjn49svz-ghvcNKRbC90ba"

schedule:
  timezone: "Asia/Seoul"
  # 매일 낮 12시 발행 (오전 11:30까지 올린 사진이 대상).
  # 실제 실행 시각은 .github/workflows/daily-content.yml 의 cron 에서 관리한다.
  publish_hour: 12

grouping:
  # 같은 상품을 여러 각도에서 찍은 사진을 하나로 묶는 기준 (초).
  # 파일명 20260821_105013.jpg 처럼 촬영 시각이 들어있으면 그걸 쓰고, 없으면 드라이브 업로드 시각을 쓴다.
  max_gap_seconds: 150
  # 한 상품 묶음의 최대 사진 수 (비전 모델에 넘길 사진 수)
  max_photos_per_group: 4
  # 하루에 만들 카드뉴스 최대 장수 (0 = 제한 없음)
  max_cards_per_day: 0

model:
  # 어느 회사 모델을 쓸지: gemini | anthropic | auto
  #   gemini    - 구글 AI 스튜디오. 무료 등급이 있어 카드 등록 없이 쓸 수 있다. (기본)
  #   anthropic - Claude. 유료(선불 크레딧). 가격표 판독이 조금 더 정확하다.
  #   auto      - GEMINI_API_KEY 가 있으면 제미나이, 없으면 Claude
  provider: "gemini"

  # 사진에서 상품명/가격을 읽는 모델
  vision: "gemini-2.5-flash"
  # 웹 검색으로 제품 설명을 찾고 블로그 글을 쓰는 모델
  writing: "gemini-2.5-flash"

  # Claude 로 바꾸려면:
  #   provider: "anthropic"
  #   vision:  "claude-opus-5"
  #   writing: "claude-opus-5"

store:
  name: "리본마켓 평택점"
  handle: "@reborn.mk"
  # 카드뉴스 하단/블로그 마무리에 들어가는 안내 문구
  footer_note: "매장 재고는 한정 수량, 소진 시 조기 종료됩니다"
  visit_line: "리본마켓 평택점 · 매장에서 직접 보고 구매하세요"

card:
  width: 1080
  height: 1920
  orig_label: "온라인 판매가"
  sale_label: "리본마켓 초특가"

blog:
  best_count: 5

instagram:
  # 인스타그램 스토리 자동 게시. 켜려면 아래 두 가지가 설정되어 있어야 한다:
  #  1) IG_USER_ID / IG_ACCESS_TOKEN  (인스타 비즈니스 계정 + 메타 앱)
  #  2) 이미지 공개 URL 호스팅 (R2_* 환경변수)  — 인스타는 공개 URL 만 받는다
  # 자세한 설정은 docs/SETUP.md 5단계 참고.
  enabled: true
  # 하루에 스토리로 올릴 최대 장수. 인스타 API 는 계정당 24시간에 25건 제한이 있다.
  max_stories_per_day: 10
  # 스토리 사이 간격(초). 한꺼번에 쏟아붓지 않게 띄운다.
  delay_between_seconds: 20
