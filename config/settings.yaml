# 리본마켓 자동 콘텐츠 발행 설정
# 모든 값은 같은 이름의 대문자 환경변수로 덮어쓸 수 있습니다. (예: SOURCE_FOLDER_ID)

drive:
  # 매일 상품 사진이 올라오는 폴더 (읽기)
  source_folder_id: "1oAEi2LrzoOSlDO1TwVDpVWdb771wHdqz"
  # 생성된 콘텐츠를 업로드할 폴더 이름. 없으면 자동 생성한다.
  publish_folder_name: "콘텐츠 발행"
  # 콘텐츠 발행 폴더를 만들 상위 폴더. 비우면 소스 폴더와 같은 위치(내 드라이브 루트)에 만든다.
  publish_parent_id: ""
  # 리본마켓 로고 PNG 파일 ID (드라이브). 카드뉴스마다 이 로고를 넣는다.
  logo_file_id: "1-PcY9uJ1vpZWozjhx6DXjP0tormDu7nt"

schedule:
  timezone: "Asia/Seoul"
  # 카드뉴스를 만드는 시각 (GitHub Actions cron 은 .github/workflows/daily-content.yml 에서 관리)
  publish_hour: 18

grouping:
  # 같은 상품을 여러 각도에서 찍은 사진을 하나로 묶는 기준 (초).
  # 파일명 20260821_105013.jpg 처럼 촬영 시각이 들어있으면 그걸 쓰고, 없으면 드라이브 업로드 시각을 쓴다.
  max_gap_seconds: 150
  # 한 상품 묶음의 최대 사진 수 (비전 모델에 넘길 사진 수)
  max_photos_per_group: 4
  # 하루에 만들 카드뉴스 최대 장수 (0 = 제한 없음)
  max_cards_per_day: 0

model:
  # 사진에서 상품명/가격을 읽는 모델
  vision: "claude-opus-5"
  # 웹 검색으로 제품 설명을 찾고 블로그 글을 쓰는 모델
  writing: "claude-opus-5"
  # 비용을 줄이려면 vision 을 "claude-sonnet-5" 로 바꿔도 됩니다.
  # (가격표 판독 정확도가 조금 떨어질 수 있어 기본값은 opus 입니다.)

store:
  name: "리본마켓 평택점"
  handle: "@reborn.mk"
  # 카드뉴스 하단/블로그 마무리에 들어가는 안내 문구
  footer_note: "매장 재고는 한정 수량, 소진 시 조기 종료됩니다"
  visit_line: "리본마켓 평택점 · 매장에서 직접 보고 구매하세요"

card:
  width: 1080
  height: 1920
  orig_label: "온라인 판매가"
  sale_label: "리본마켓 초특가"

blog:
  best_count: 5
