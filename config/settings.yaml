# 매장 자동 콘텐츠 발행 설정
#
# 아래 drive/store/card 값은 **공통 기본값**이고, 맨 끝 `stores:` 에서 매장마다
# 다른 것만 덮어씁니다. 매장을 더 늘리려면 stores 에 항목 하나만 추가하면 됩니다.
# 대부분의 값은 같은 이름의 대문자 환경변수로도 덮어쓸 수 있습니다.
# (환경변수는 모든 매장에 똑같이 적용되니 매장별 값에는 쓰지 마세요)

drive:
  # 상품 사진이 올라오는 폴더들. 폴더마다 성격이 달라서 문구가 달라진다.
  sources:
    - name: "리퍼"
      folder_id: "1oAEi2LrzoOSlDO1TwVDpVWdb771wHdqz"
      kind: "refurb"          # 검수를 마친 리퍼브 상품
      eyebrow: "오늘의 리본 특가"
    - name: "새상품"
      folder_id: "17EZH2F7VgEHbc4mHfNmS2nI9RBI-sCmR"
      kind: "new"             # 제조사와 직거래한 미개봉 새상품
      eyebrow: "제조사 직거래 새상품"

  # 생성된 콘텐츠를 업로드할 폴더 이름. 없으면 자동 생성한다.
  publish_folder_name: "콘텐츠 발행"
  # 콘텐츠 발행 폴더를 만들 상위 폴더. 비우면 소스 폴더의 상위 폴더(입고상품)에 만든다.
  publish_parent_id: ""
  # 리본마켓 로고 PNG 파일 ID (드라이브: 입고상품/리본마켓로고).
  # 카드뉴스마다 이 로고를 넣는다. 저장소에 assets/reborn_logo.png 를 두면 그쪽이 우선한다.
  logo_file_id: "1WWB5_20er3Sjn49svz-ghvcNKRbC90ba"

schedule:
  timezone: "Asia/Seoul"
  # 매일 낮 12시 발행 (오전 11:30까지 올린 사진이 대상).
  # 실제 실행 시각은 .github/workflows/daily-content.yml 의 cron 에서 관리한다.
  publish_hour: 12

grouping:
  # 사진은 촬영 시각이 아니라 '내용'으로 묶는다.
  # 한 장씩 가격표/상품/둘다 를 먼저 판독하고, 가격표를 상품의 경계로 삼는다.
  # (예전에는 촬영 간격으로 묶었는데, 연달아 찍으면 수십 장이 한 덩어리가 됐다)
  max_gap_seconds: 150
  # 안전장치: 가격표를 못 읽어도 한 묶음이 이 장수를 넘지 않게 끊는다
  max_photos_per_group: 6
  # 하루에 만들 카드뉴스 최대 장수 (0 = 제한 없음)
  max_cards_per_day: 0

model:
  # 어느 방식으로 모델을 부를지: auto | claude-cli | gemini | anthropic
  #   claude-cli - 설치된 `claude` 명령을 부른다. **은성님 클로드 구독**으로 돌아서
  #                API 키도 종량 결제도 필요 없다. 코워크에서 쓰시던 것과 같은 방식.
  #   gemini     - 구글 AI 스튜디오. 무료 등급은 모델당 하루 20회라 상품 10개쯤에서 막힌다.
  #   anthropic  - Claude API. 별도 선불 크레딧이 필요하다(구독과 별개).
  #   auto       - 구독으로 돌 수 있으면 그걸 쓰고, 아니면 있는 키를 쓴다. (기본)
  provider: "auto"

  # 구독(claude-cli)으로 돌 때 쓸 모델
  cli_vision: "claude-sonnet-5"
  cli_writing: "claude-sonnet-5"

  # 제미나이/Claude API 로 돌 때 쓸 모델
  vision: "gemini-3.6-flash"
  writing: "gemini-3.6-flash"

store:
  name: "리본마켓 평택점"
  handle: "@reborn.mk"
  # 카드뉴스 하단/블로그 마무리에 들어가는 안내 문구
  footer_note: "매장 재고는 한정 수량, 소진 시 조기 종료됩니다"
  visit_line: "리본마켓 평택점 · 매장에서 직접 보고 구매하세요"

card:
  width: 1080
  height: 1920
  orig_label: "온라인 판매가"
  sale_label: "리본마켓 초특가"

blog:
  best_count: 5

instagram:
  # 인스타그램 스토리 자동 게시. 켜려면 아래 두 가지가 설정되어 있어야 한다:
  #  1) IG_USER_ID / IG_ACCESS_TOKEN  (인스타 비즈니스 계정 + 메타 앱)
  #  2) 이미지 공개 URL 호스팅 (R2_* 환경변수)  — 인스타는 공개 URL 만 받는다
  # 자세한 설정은 docs/SETUP.md 5단계 참고.
  enabled: true
  # 하루에 스토리로 올릴 최대 장수. 인스타 API 는 계정당 24시간에 25건 제한이 있다.
  max_stories_per_day: 10
  # 스토리 사이 간격(초). 한꺼번에 쏟아붓지 않게 띄운다.
  delay_between_seconds: 20
  # 그날 카드뉴스를 이어 붙인 릴스도 한 편 올린다. 스토리는 24시간이면 사라지지만
  # 릴스는 계정에 남아서 나중에 온 손님도 본다.
  # 카드가 이미 9:16 이라 자르거나 줄이지 않고 그대로 쓴다 (피드 캐러셀은 4:5 라 가격이 잘린다).
  reel_enabled: true
  # 카드 한 장이 화면에 머무는 시간(초).
  reel_seconds_per_card: 0.8
  # 릴스 맨 앞 표지에 크게 들어갈 문구.
  reel_headline: 오늘의 추천템

